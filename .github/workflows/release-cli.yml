name: Release CLI Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release_readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify committed release invariants
        run: node scripts/check_version_sync.mjs --release

      # Per-PR CI tolerates a stale test count so a number that moves whenever
      # anyone adds a test cannot redden everyone's checks (#666). Nothing
      # refreshes it automatically though, so it is binding here instead: a
      # release should not publish a figure that has been drifting for weeks.
      - name: Verify site release constants including the test count
        run: node scripts/sync_site_release_version.mjs --check-release

  build:
    name: Build (${{ matrix.target }})
    needs: release_readiness
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: minutes
            asset: minutes-macos-arm64
            # The loader adds about 0.1 MiB to the CLI. The isolated runtime is
            # packaged in the sherpa archive below so it does not conflict with
            # diarization's newer ONNX Runtime.
            features: parakeet,metal,engine-sherpa
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: minutes.exe
            asset: minutes-windows-x64.exe
            features: parakeet
          - target: x86_64-unknown-linux-gnu
            # Match the documented glibc 2.39 baseline. A moving runner image
            # can silently produce binaries that older supported hosts cannot start.
            os: ubuntu-24.04
            binary: minutes
            asset: minutes-linux-x64
            features: parakeet

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: .github/scripts/apt-install.sh libasound2-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Set CXXFLAGS for whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-I$(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"

      - name: Configure portable Windows CPU baseline
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/export-windows-cpu-baseline.sh

      - name: Resolve runner image for cache scope
        id: runner-image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Scope by runner image so a runner-image rotation does not restore a stale
          # target/ cache with toolchain paths the new image no longer ships
          # (e.g. macOS 15 -> macOS 26 Xcode change). See ci.yml.
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Clean stale Windows native build cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf \
            target/debug/build/whisper-rs-sys-* \
            target/release/build/whisper-rs-sys-* \
            target/debug/build/knf-rs-sys-* \
            target/release/build/knf-rs-sys-*

      - name: Build release binary
        run: cargo build --release -p minutes-cli --features ${{ matrix.features }} --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Verify Linux binary compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/check_linux_glibc.py "${{ matrix.asset }}"
          binary="$GITHUB_WORKSPACE/${{ matrix.asset }}"
          ( cd /tmp && env -u LD_LIBRARY_PATH "$binary" --version )

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: ${{ matrix.asset }}

      # Windows needs the MSVC runtime beside the executable. Nothing ships it
      # today, so on a PC that has never had the Visual C++ Redistributable the
      # binary exits 0xC0000135 (STATUS_DLL_NOT_FOUND) printing nothing at all
      # (#657). Static linking is not available: ort-sys ships prebuilt ONNX
      # Runtime against the dynamic CRT and will not link (#659).
      #
      # Verified on a clean Windows 11 VM: the same binary fails bare and runs
      # with these four files beside it. Windows resolves the application
      # directory ahead of the system path, so no install step is needed.
      #
      # The bare .exe is still published so already-installed MCP servers keep
      # resolving it, but the zip is what a clean machine needs.
      - name: Package Windows CLI with the MSVC runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same lookup rules as tauri/src-tauri/build.rs find_vc_redist_dir.
          # Any VS year, any Microsoft.VC<major>.CRT, ordered by the parsed
          # redist version rather than by path text: the edition segment sits
          # ahead of the version in the path, so `Sort-Object FullName` picked
          # Professional 14.29 over Community 14.44 on a box with both. Pinning
          # '2022' and 'VC143' would also silently stop matching the next
          # toolset.
          #
          # Two details that keep this equivalent to build.rs rather than
          # merely similar:
          #  - require at least two version components, because [version]
          #    rejects a bare '14' and would abort the step under
          #    ErrorActionPreference='Stop'
          #  - require vcruntime140.dll to be present in the candidate, so an
          #    incomplete redist directory falls through to the next-best
          #    version instead of being selected and then hard-throwing below
          $crt = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT' -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Parent.Parent.Name -match '^\d+(\.\d+)+$' } |
                 Where-Object { Test-Path (Join-Path $_.FullName 'vcruntime140.dll') } |
                 Sort-Object @{ Expression = { [version]$_.Parent.Parent.Name } } -Descending |
                 Select-Object -First 1
          if (-not $crt) { throw 'Could not locate a complete VC CRT redistributable on the runner' }
          Write-Host "CRT source: $($crt.FullName)"
          $stage = 'minutes-windows-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item '${{ matrix.asset }}' (Join-Path $stage 'minutes.exe') -Force
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll') {
            $src = Join-Path $crt.FullName $dll
            if (-not (Test-Path $src)) { throw "missing $dll in $($crt.FullName)" }
            Copy-Item $src $stage -Force
          }
          # Derive the requirement from the binary rather than a hardcoded
          # list. Counting the four files we just copied only validated our own
          # copy loop: a dependency adding an import such as MSVCP140_2.dll
          # (C++17 special math) or MSVCP140_ATOMIC_WAIT.dll (C++20 atomic
          # wait) would reproduce #657 with a green job.
          $dumpbin = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found; cannot verify the import table' }
          $imports = & $dumpbin.FullName /dependents "$stage\minutes.exe" |
                     Select-String -Pattern '^\s+(\S+\.dll)$' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
          $needed = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)' }
          Write-Host "runtime imports: $($needed -join ', ')"
          if (-not $needed) { throw 'no VC runtime imports detected; the import scan is probably broken' }
          $missing = $needed | Where-Object { -not (Test-Path (Join-Path $stage $_)) }
          if ($missing) { throw "minutes.exe imports runtime DLLs missing from the archive: $($missing -join ', '). Stage them too (#657)." }
          Compress-Archive -Path "$stage\*" -DestinationPath 'minutes-windows-x64.zip' -Force
          Write-Host ("archive MB: {0:N2}" -f ((Get-Item 'minutes-windows-x64.zip').Length/1MB))

      - name: Upload Windows zip artifact
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: minutes-windows-x64.zip
          path: minutes-windows-x64.zip

      - name: Upload Windows zip release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-pc-windows-msvc'
        with:
          draft: true
          files: minutes-windows-x64.zip

      # Additive second artifact for Linux only: the same CLI plus the sherpa
      # engine and its shared libraries, as a tarball. The bare binary above is
      # unchanged, so existing installs and the Homebrew formula are unaffected.
      #
      # sherpa-onnx links dynamically on Linux, so its shared libraries ship
      # beside the plugin. `$ORIGIN` runpath makes the loader look next to the
      # loading image rather than in the build tree. Static linkage is
      # deliberately not used here: sherpa-rs-sys demands a global
      # `-C relocation-model=dynamic-no-pic`, which produces a non-PIE binary
      # and loses ASLR for every Linux user (#645).
      #
      # Since #685 sherpa lives in a dlopened cdylib outside the workspace, so
      # `-p minutes-cli --features engine-sherpa` builds only the loader and
      # emits no sherpa libraries at all. This step used to copy `*.so` out of
      # the CLI's target dir, which now finds nothing; the archive has to build
      # crates/sherpa-plugin and take its artifacts instead. Only a tag runs
      # this workflow, so the break was invisible until release time, which is
      # what scripts/check_sherpa_packaging.mjs now prevents.
      - name: Build sherpa-enabled Linux archive
        # Keyed on by scripts/check_sherpa_packaging.py, so that renaming this
        # step is a rename rather than a silent loss of its packaging gate.
        id: sherpa-archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        # No RUSTFLAGS rpath here any more. The executable no longer links
        # sherpa at all, and the plugin sets its own `$ORIGIN` runpath from
        # crates/sherpa-plugin/build.rs, so it locates its libraries whether it
        # is packaged here or installed by hand. A global RUSTFLAGS would also
        # invalidate the shared build cache for every other step.
        run: |
          set -euo pipefail
          cargo build --release -p minutes-cli \
            --features ${{ matrix.features }},engine-sherpa \
            --target ${{ matrix.target }}
          # Excluded from the workspace, so it needs its own build invocation.
          ( cd crates/sherpa-plugin && cargo build --release --locked )
          plugin_dir="crates/sherpa-plugin/target/release"
          out="minutes-linux-x64-sherpa"
          # Separate statements: a failure on the left of `&&` does not trip
          # errexit, so a half-removed stale directory could have survived into
          # the archive.
          rm -rf "$out"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$out/minutes"
          cp "$plugin_dir/libminutes_sherpa.so" "$out/"
          # sherpa-rs-sys drops its shared libraries into the plugin's profile
          # dir; the plugin resolves them through its own $ORIGIN.
          #
          # `-exec ... +` rather than `\;`: with `\;` find exits 0 even when
          # every cp failed, which would have produced an archive missing its
          # libraries with no error anywhere.
          find "$plugin_dir" -maxdepth 1 -name '*.so' ! -name 'libminutes_sherpa.so' \
            -exec cp -t "$out/" {} +
          # libonnxruntime.so is asserted too. Leaving it out meant the dlopen
          # below could still pass by finding a system copy, since only
          # LD_LIBRARY_PATH is cleared and the default loader paths remain.
          for lib in libminutes_sherpa.so libsherpa-onnx-c-api.so libonnxruntime.so; do
            test -f "$out/$lib" \
              || { echo "::error::$lib missing from the sherpa archive"; exit 1; }
          done
          # Prove both images load outside the build tree, which a build-only
          # check cannot catch: the failure mode is loader search paths. The
          # binary running proves nothing about the plugin, because the plugin
          # is dlopened lazily and only when sherpa is actually selected.
          ( cd /tmp && env -u LD_LIBRARY_PATH "$GITHUB_WORKSPACE/$out/minutes" --version )
          ( cd /tmp && env -u LD_LIBRARY_PATH python3 \
              "$GITHUB_WORKSPACE/scripts/verify_sherpa_plugin_loads.py" \
              "$GITHUB_WORKSPACE/$out/libminutes_sherpa.so" )
          python3 scripts/check_linux_glibc.py "$out/minutes" "$out/"*.so
          tar czf "$out.tar.gz" "$out"

      - name: Upload sherpa archive artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: minutes-linux-x64-sherpa.tar.gz
          path: minutes-linux-x64-sherpa.tar.gz

      - name: Upload sherpa archive release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          draft: true
          files: minutes-linux-x64-sherpa.tar.gz

  macos_sherpa_archive:
    name: Package signed macOS sherpa CLI archive
    needs: [release_readiness, build]
    runs-on: macos-latest
    # The Developer ID credentials are environment-scoped. Keep them out of
    # the cross-platform build matrix and expose them only to this macOS job.
    environment: production-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set CXXFLAGS for sherpa-onnx
        run: echo "CXXFLAGS=-I$(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"

      - name: Download the arm64 CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: minutes-macos-arm64
          path: release-input

      - name: Package macOS CLI with the signed in-process sherpa plugin
        id: sherpa-macos-archive
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ( cd crates/sherpa-plugin && cargo build --release --locked )
          ( cd crates/sherpa-plugin && cargo build --release --locked --features legacy-static --target-dir target/legacy-static )
          plugin="crates/sherpa-plugin/target/release/libminutes_sherpa.dylib"
          out="minutes-macos-arm64-sherpa"
          test -f "$plugin"
          rm -rf "$out"
          mkdir -p "$out"
          cp -f "release-input/minutes-macos-arm64" "$out/minutes"
          cp -f "$plugin" "$out/"
          # The plugin links sherpa-onnx and its private ONNX Runtime as shared
          # libraries and finds them beside itself through @loader_path.
          for lib in libsherpa-onnx-c-api.dylib libonnxruntime.dylib; do
            cp -f "crates/sherpa-plugin/target/release/$lib" "$out/"
            test -f "$out/$lib" \
              || { echo "::error::$lib missing from the macOS sherpa archive"; exit 1; }
          done
          # download-artifact normalizes files to 0644. Restore and exercise
          # the packaged CLI so extracting this archive yields a runnable tool.
          chmod 755 "$out/minutes"
          test -x "$out/minutes"
          "$out/minutes" --version

          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            keychain="$RUNNER_TEMP/minutes-cli-release.keychain-db"
            certificate="$RUNNER_TEMP/minutes-cli-release.p12"
            keychain_password="$(openssl rand -hex 24)"
            python3 - "$certificate" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True)
          )
          PY
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$certificate" -k "$keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain"
            security find-identity -v -p codesigning "$keychain" \
              | grep -Fq "$APPLE_SIGNING_IDENTITY"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$out/libminutes_sherpa.dylib"
            codesign --verify --strict --verbose=4 "$out/libminutes_sherpa.dylib"
            for lib in libsherpa-onnx-c-api.dylib libonnxruntime.dylib; do
              codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" "$out/$lib"
              codesign --verify --strict --verbose=4 "$out/$lib"
            done
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Apple signing credentials are required for a release archive"
            exit 1
          else
            echo "Apple signing credentials unavailable; producing an unsigned workflow-dispatch artifact"
          fi

          # Loader verification must inspect the packaged copy after signing.
          ( cd /tmp && python3 \
              "$GITHUB_WORKSPACE/scripts/verify_sherpa_plugin_loads.py" \
              "$GITHUB_WORKSPACE/$out/libminutes_sherpa.dylib" )
          # New clients use a new asset name. Already-published MCP packages
          # keep receiving the two-file, statically linked layout they accept.
          COPYFILE_DISABLE=1 tar czf "$out-shared.tar.gz" "$out"
          cp -f crates/sherpa-plugin/target/legacy-static/release/libminutes_sherpa.dylib "$out/libminutes_sherpa.dylib"
          rm -f "$out/libsherpa-onnx-c-api.dylib" "$out/libonnxruntime.dylib"
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$out/libminutes_sherpa.dylib"
            codesign --verify --strict --verbose=4 "$out/libminutes_sherpa.dylib"
          fi
          ( cd /tmp && python3 \
              "$GITHUB_WORKSPACE/scripts/verify_sherpa_plugin_loads.py" \
              "$GITHUB_WORKSPACE/$out/libminutes_sherpa.dylib" )
          COPYFILE_DISABLE=1 tar czf "$out.tar.gz" "$out"

      - name: Upload macOS sherpa archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: minutes-macos-arm64-sherpa.tar.gz
          path: |
            minutes-macos-arm64-sherpa.tar.gz
            minutes-macos-arm64-sherpa-shared.tar.gz

      - name: Upload macOS sherpa archive release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            minutes-macos-arm64-sherpa.tar.gz
            minutes-macos-arm64-sherpa-shared.tar.gz

  # The Desktop Extension bundle. Built here rather than by hand because it is
  # the artifact the Claude Desktop directory serves, and a hand step is one
  # that gets skipped: v0.25.1 shipped every other asset automatically and was
  # missing this one until someone counted the assets against the previous
  # release. That release existed specifically to fix the extension.
  mcpb:
    name: Desktop Extension bundle
    runs-on: ubuntu-latest
    needs: release_readiness
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install MCP dependencies from this exact checkout
        run: node scripts/install_mcp_dependencies.mjs

      - name: Build the MCP server
        working-directory: crates/mcp
        run: npm run build

      - name: Pack the bundle
        run: |
          npm install -g @anthropic-ai/mcpb
          ./scripts/pack_mcpb.sh minutes.mcpb

      - name: The bundle must be healthy and match this tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # The same guard CI runs, so a dev-only package leaking into the
          # bundle fails the release rather than shipping it.
          ./scripts/check_mcpb_bundle.sh minutes.mcpb

          bundled=$(python3 -c "import zipfile,json;print(json.loads(zipfile.ZipFile('minutes.mcpb').read('manifest.json'))['version'])")
          echo "bundle manifest version: $bundled"

          # Only a tag run has a version to compare against. On
          # workflow_dispatch, ref_name is a branch, and comparing the bundle
          # to "main" would fail a build that is otherwise fine.
          if [ "${REF_TYPE:-}" = "tag" ]; then
            expected="${REF_NAME#v}"
            if [ "$bundled" != "$expected" ]; then
              echo "::error::bundle manifest says $bundled but this tag is $expected"
              exit 1
            fi
            echo "bundle matches tag $expected"
          else
            echo "not a tag run, skipping the version comparison"
          fi

      # Through the artifact store as well, so the checksums job includes it in
      # SHA256SUMS.txt. Every other published asset has a checksum; this one
      # never has, because it was uploaded by hand after the fact.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: minutes.mcpb
          path: minutes.mcpb

      - name: Upload bundle release asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: minutes.mcpb

  checksums:
    name: Publish CLI checksums
    needs: [release_readiness, build, macos_sherpa_archive, mcpb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f | sort | while IFS= read -r file; do
            sha="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$sha" "$(basename "$file")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksum release asset
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: SHA256SUMS.txt
