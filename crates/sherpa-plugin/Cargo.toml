[package]
name = "minutes-sherpa-plugin"
version = "0.0.0"
edition = "2021"
publish = false
description = "Isolated sherpa-onnx transcription plugin for Minutes (issue #685)"

[lib]
name = "minutes_sherpa"
crate-type = ["cdylib"]

[features]
# Keep the original two-file release archive usable by already-published MCP
# clients. New clients and desktop builds use the faster shared engine.
legacy-static = ["dep:sherpa-rs"]

# Deliberately outside the workspace. This crate embeds the whole sherpa-onnx
# stack, so building it downloads a large prebuilt bundle; making it a member
# would put that on every `cargo clippy --all`. It also ships separately from
# the binaries, which is the entire point of #685.

# The default macOS build does not use sherpa-rs. Its newest release pins sherpa-onnx 1.12.9,
# which bundles ONNX Runtime 1.17.1 and decodes the Parakeet int8 model about
# three times slower than 1.13.x. build.rs downloads the 1.13.x shared archive
# instead and generates bindings from its own headers. The ONNX Runtime stays
# a private dylib beside this plugin, so the host's ort never sees it (#683).
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-rs = { version = "0.6.8", optional = true, default-features = false, features = ["download-binaries", "static", "sys"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.69.4"
bzip2 = { version = "0.4.4", features = ["static"] }
sha2 = "0.10"
tar = "0.4"
ureq = "2"

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "sys"] }

[target.'cfg(target_os = "windows")'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "sys"] }

[profile.release]
opt-level = 2
